<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>股票解读</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    color: #e0e0f0;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    min-height: 100vh;
  }

  /* ── 顶部标题区 ── */
  .hero {
    padding: 36px 20px 24px;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    color: #00ff94;
    border: 1px solid #00ff9444;
    padding: 3px 10px;
    border-radius: 2px;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  h1 { font-size: 34px; font-weight: 800; line-height: 1.1; color: #fff; margin-bottom: 6px; }
  h1 span { color: #00ff94; }
  .subtitle { color: #555; font-size: 13px; line-height: 1.6; }

  /* ── 市场切换 ── */
  .market-tabs {
    display: flex;
    gap: 8px;
    padding: 0 20px;
    margin: 20px 0 12px;
  }
  .market-tab {
    flex: 1;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid #1e1e2e;
    background: transparent;
    color: #555;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  .market-tab.active {
    background: #00ff9415;
    border-color: #00ff9444;
    color: #00ff94;
  }

  /* ── 搜索区 ── */
  .search-area { padding: 0 20px; margin-bottom: 12px; }
  .search-row { display: flex; gap: 10px; margin-bottom: 10px; }
  input#tickerInput {
    flex: 1;
    background: #111118;
    border: 1px solid #1e1e2e;
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 16px;
    color: #fff;
    outline: none;
    -webkit-appearance: none;
  }
  input#tickerInput:focus { border-color: #00ff9466; }
  input#tickerInput::placeholder { color: #333; }

  .hint { font-size: 12px; color: #333; margin-bottom: 10px; line-height: 1.5; }

  button.main {
    background: #00ff94;
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 13px 20px;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  button.main:disabled { opacity: 0.4; }

  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    font-size: 12px;
    padding: 5px 12px;
    border: 1px solid #1e1e2e;
    border-radius: 4px;
    background: transparent;
    color: #555;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── 结果卡片 ── */
  .result-area { padding: 0 20px; margin-bottom: 24px; }

  .card {
    background: #111118;
    border: 1px solid #1e1e2e;
    border-radius: 12px;
    overflow: hidden;
  }
  .card-head {
    padding: 16px 18px;
    border-bottom: 1px solid #1e1e2e;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ticker-tag {
    font-size: 16px;
    font-weight: 700;
    color: #00ff94;
    background: #00ff9412;
    border: 1px solid #00ff9433;
    padding: 4px 10px;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .card-title { font-size: 14px; font-weight: 600; color: #fff; }
  .card-body { padding: 18px; }

  .section { margin-bottom: 18px; }
  .section-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: #00ff94;
    opacity: 0.8;
    margin-bottom: 7px;
    text-transform: uppercase;
  }
  .section-text { font-size: 14px; line-height: 1.8; color: #b0b0c8; }
  .divider { height: 1px; background: #1e1e2e; margin: 14px 0; }

  .verdict {
    background: #00ff9408;
    border: 1px solid #00ff9422;
    border-radius: 8px;
    padding: 14px;
  }
  .verdict .section-text { color: #c0f0d8; }

  /* 财务数据表格 */
  .fin-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 4px;
  }
  .fin-item {
    background: #0d0d18;
    border: 1px solid #1e1e2e;
    border-radius: 6px;
    padding: 10px 12px;
  }
  .fin-label { font-size: 11px; color: #555; margin-bottom: 4px; }
  .fin-value { font-size: 15px; font-weight: 700; color: #e0e0f0; }
  .fin-value.up { color: #00ff94; }
  .fin-value.down { color: #ff6b6b; }

  /* ── Loading ── */
  .loading { padding: 36px 18px; text-align: center; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #00ff94; animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.15} 40%{opacity:1} }
  .loading-text { font-size: 11px; color: #444; letter-spacing: 2px; }

  .error-box {
    background: #ff444411;
    border: 1px solid #ff444433;
    border-radius: 8px;
    padding: 14px 16px;
    color: #ff8888;
    font-size: 14px;
  }

  /* ── 搜索建议 ── */
  .search-wrapper { position: relative; flex: 1; }
  .suggestions {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: #1a1a28;
    border: 1px solid #2a2a40;
    border-top: none;
    border-radius: 0 0 10px 10px;
    z-index: 100;
    overflow: hidden;
  }
  .suggestion-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    cursor: pointer;
    border-bottom: 1px solid #1e1e2e;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s;
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:active { background: #00ff9410; }
  .sug-code {
    font-size: 13px;
    font-weight: 700;
    color: #00ff94;
    min-width: 60px;
    font-family: monospace;
  }
  .sug-name { font-size: 14px; color: #e0e0f0; flex: 1; }
  .sug-sector { font-size: 11px; color: #555; }

  /* ── 对话框 ── */
  .chat-section { padding: 0 20px 40px; }
  .chat-title {
    font-size: 13px;
    color: #555;
    margin-bottom: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .chat-title span { color: #00ff94; }

  .chat-messages {
    background: #111118;
    border: 1px solid #1e1e2e;
    border-radius: 12px 12px 0 0;
    padding: 16px;
    min-height: 120px;
    max-height: 320px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg { display: flex; flex-direction: column; gap: 3px; }
  .msg.user { align-items: flex-end; }
  .msg.ai { align-items: flex-start; }

  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
  }
  .msg.user .bubble {
    background: #00ff9420;
    border: 1px solid #00ff9433;
    color: #d0f0df;
    border-radius: 12px 12px 2px 12px;
  }
  .msg.ai .bubble {
    background: #1a1a28;
    border: 1px solid #1e1e2e;
    color: #c0c0d8;
    border-radius: 12px 12px 12px 2px;
  }

  .chat-input-row {
    display: flex;
    border: 1px solid #1e1e2e;
    border-top: none;
    border-radius: 0 0 12px 12px;
    overflow: hidden;
  }
  input#chatInput {
    flex: 1;
    background: #0d0d18;
    border: none;
    padding: 12px 14px;
    font-size: 14px;
    color: #fff;
    outline: none;
    -webkit-appearance: none;
  }
  input#chatInput::placeholder { color: #333; }
  .send-btn {
    background: #00ff94;
    color: #000;
    border: none;
    padding: 12px 18px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .send-btn:disabled { opacity: 0.4; }

  /* markdown in chat */
  .bubble table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
  .bubble th, .bubble td { border: 1px solid #2a2a3a; padding: 6px 10px; text-align: left; line-height: 1.5; }
  .bubble th { background: #1a1a28; color: #00ff94; font-weight: 600; }
  .bubble td { color: #b0b0c8; }
  .bubble tr:nth-child(even) td { background: #0d0d18; }
  .bubble strong { color: #e0e0f0; }
  .bubble p { margin-bottom: 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0; }
  .bubble li { margin-bottom: 4px; line-height: 1.6; }
  .bubble h1,.bubble h2,.bubble h3 { color: #e0e0f0; margin: 10px 0 6px; font-size: 14px; }

  .chat-hint {
    font-size: 11px;
    color: #2a2a3a;
    margin-top: 8px;
    line-height: 1.5;
  }

  .footer {
    padding: 0 20px 30px;
    font-size: 11px;
    color: #2a2a3a;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>

    <button class="chip" onclick="quickPick('AMZN')">AMZN</button>
    <button class="chip" onclick="quickPick('META')">META</button>
  </div>
</div>

<!-- 结果 -->
<div class="result-area" id="result"></div>

<!-- 对话框 -->
<div class="chat-section" id="chatSection" style="display:none">
  <div class="chat-title">继续提问 · <span>针对当前股票</span></div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-row">
    <input id="chatInput" placeholder="比如：这家公司适合长期持有吗？" onkeydown="if(event.key==='Enter')sendChat()">
    <button class="send-btn" id="sendBtn" onclick="sendChat()">发送</button>
  </div>
  <div class="chat-hint">可以继续追问任何关于这家公司的问题</div>
</div>

<div class="footer">仅供学习参考 · 不构成投资建议 · 投资有风险</div>

// ── 搜索逻辑 ──
let selectedIdx = -1;
let filteredSugs = [];

function onSearchInput(val) {
  const q = val.trim().toLowerCase();
  const sugsDiv = document.getElementById('suggestions');
  if (!q) { sugsDiv.style.display = 'none'; return; }

  const db = STOCKS[currentMarket] || [];
  filteredSugs = db.filter(s =>
    s.name.includes(val.trim()) ||
    s.code.toLowerCase().includes(q) ||
    s.en.toLowerCase().includes(q) ||
    (s.sector && s.sector.includes(val.trim()))
  ).slice(0, 6);

  if (filteredSugs.length === 0) { sugsDiv.style.display = 'none'; return; }

  selectedIdx = -1;
  sugsDiv.innerHTML = filteredSugs.map((s, i) =>
    `<div class="suggestion-item" onmousedown="pickSuggestion(${i})">
      <span class="sug-code">${s.code}</span>
      <span class="sug-name">${s.name}</span>
      <span class="sug-sector">${s.sector}</span>
    </div>`
  ).join('');
  sugsDiv.style.display = 'block';
}

function onSearchKeydown(e) {
  const sugsDiv = document.getElementById('suggestions');
  if (sugsDiv.style.display === 'none') {
    if (e.key === 'Enter') analyze();
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    selectedIdx = Math.min(selectedIdx + 1, filteredSugs.length - 1);
    highlightSug();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    selectedIdx = Math.max(selectedIdx - 1, -1);
    highlightSug();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (selectedIdx >= 0) pickSuggestion(selectedIdx);
    else { sugsDiv.style.display = 'none'; analyze(); }
  } else if (e.key === 'Escape') {
    sugsDiv.style.display = 'none';
  }
}

function highlightSug() {
  document.querySelectorAll('.suggestion-item').forEach((el, i) => {
    el.style.background = i === selectedIdx ? '#00ff9415' : '';
  });
  if (selectedIdx >= 0) {
    document.getElementById('tickerInput').value = filteredSugs[selectedIdx].code;
  }
}

function pickSuggestion(idx) {
  const s = filteredSugs[idx];
  document.getElementById('tickerInput').value = s.code;
  document.getElementById('suggestions').style.display = 'none';
  analyze();
}

function renderMarkdown(text) {
  // escape HTML first
  let html = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // tables
  html = html.replace(/(\|.+\|\n?)+/g, match => {
    const rows = match.trim().split('\n').filter(r => r.trim());
    let table = '<table>';
    rows.forEach((row, i) => {
      if (/^\|[-| :]+\|$/.test(row.trim())) return; // separator row
      const cells = row.split('|').filter((_,j,a) => j>0 && j<a.length-1);
      const tag = i === 0 ? 'th' : 'td';
      table += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
    });
    return table + '</table>';
  });

  // bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // bullet lists
  html = html.replace(/^[-•] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');
  // numbered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // line breaks to paragraphs
  html = html.split(/\n{2,}/).map(p => {
    p = p.trim();
    if (!p || p.startsWith('<')) return p;
    return '<p>' + p.replace(/\n/g,'<br>') + '</p>';
  }).join('');

  return html;
}

function parseResponse(text) {
  const keys = ['公司概况','财务亮点','核心优势','主要风险','综合判断'];
  const sections = {};
  for (let i = 0; i < keys.length; i++) {
    const key = keys[i];
    const next = keys[i+1];
    const start = text.indexOf('【' + key + '】');
    if (start === -1) continue;
    const from = start + key.length + 2;
    const end = next ? text.indexOf('【' + next + '】') : text.length;
    sections[key] = text.slice(from, end === -1 ? text.length : end).trim();
  }
  if (Object.keys(sections).length === 0) sections['分析'] = text;
  return sections;
}

function renderSections(ticker, sections) {
  const order = ['公司概况','财务亮点','核心优势','主要风险','综合判断','分析'];
  const present = order.filter(k => sections[k]);
  if (present.length === 0) return '';

  let html = `<div class="card">
    <div class="card-head">
      <div class="ticker-tag">${ticker}</div>
      <div class="card-title">${marketLabel()} · AI 解读</div>
    </div>
    <div class="card-body">`;

  present.forEach((key, i) => {
    if (i > 0) html += '<div class="divider"></div>';
    const isVerdict = key === '综合判断' || key === '分析';
    html += `<div class="section"><div class="section-label">${key}</div>`;
    if (isVerdict) {
      html += `<div class="verdict"><div class="section-text">${sections[key]}</div></div>`;
    } else {
      html += `<div class="section-text">${sections[key]}</div>`;
    }
    html += '</div>';
  });

  html += '</div></div>';
  return html;
}

async function analyze() {
  const input = document.getElementById('tickerInput');
  const btn = document.getElementById('analyzeBtn');
  const resultDiv = document.getElementById('result');

  let sym = input.value.trim();
  if (!sym) return;
  if (currentMarket === 'us') sym = sym.toUpperCase();

  currentTicker = sym;
  chatHistory = [];
  document.getElementById('chatSection').style.display = 'none';
  document.getElementById('chatMessages').innerHTML = '';

  btn.disabled = true;
  btn.textContent = '分析中…';
  resultDiv.innerHTML = `<div class="card"><div class="loading">
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="loading-text">正在分析 · 请稍候</div>
  </div></div>`;

  const marketMap = { us: '美股（NYSE/NASDAQ）', cn: 'A股（上海/深圳交易所）', hk: '港股（香港交易所）' };

  const prompt = `你是一位专业的股票分析师，请用通俗易懂的中文分析${marketMap[currentMarket]}股票代码：${sym}

请按以下格式输出，每个部分用【】标注：

【公司概况】
这家公司叫什么名字？主营业务是什么？靠什么赚钱？主要客户是谁？用2-3句话说清楚，像给朋友解释一样，不要用专业术语。

【财务亮点】
列出该公司最近一年的关键财务数据，包括：
- 营收规模及同比增长
- 净利润及同比变化
- 毛利率水平
- 市盈率（PE）或市值
- 负债情况简述
用数字说话，数字后面用括号说明这个数字意味着什么。如果是A股或港股，数据以人民币或港币为单位。

【核心优势】
这家公司为什么能在竞争中存活甚至领先？列出2-3个关键优势，每条用一句话说清楚。

【主要风险】
普通投资者需要关注的2-3个主要风险，用简单语言说明。

【综合判断】
综合来看，这是一家什么类型的公司？适合什么样的投资者？给出客观中立的总结，不要给出具体买卖建议。

注意：语言要简洁直白，数据尽量准确，如不确定请注明"约"或"参考数据"。`;

  try {
    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        max_tokens: 1200,
        stream: true,
        ticker: sym,
        market: currentMarket,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) throw new Error('请求失败');

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
      for (const line of lines) {
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.delta?.text || '';
          fullText += delta;
          const sections = parseResponse(fullText);
          if (Object.keys(sections).length > 0) {
            resultDiv.innerHTML = renderSections(sym, sections);
          }
        } catch(e) {}
      }
    }

    const finalSections = parseResponse(fullText);
    resultDiv.innerHTML = renderSections(sym, finalSections);

    // 记录分析结果到对话历史
    chatHistory = [
      { role: 'user', content: prompt },
      { role: 'assistant', content: fullText }
    ];

    // 显示对话框
    document.getElementById('chatSection').style.display = 'block';
    document.getElementById('chatInput').placeholder = `继续问关于 ${sym} 的问题…`;

  } catch(e) {
    resultDiv.innerHTML = `<div class="error-box">⚠ 分析失败，请检查代码是否正确后重试</div>`;
  }

  btn.disabled = false;
  btn.textContent = '分析';
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const messagesDiv = document.getElementById('chatMessages');
  const question = input.value.trim();
  if (!question || sendBtn.disabled) return;

  input.value = '';
  sendBtn.disabled = true;

  // 显示用户消息
  messagesDiv.innerHTML += `<div class="msg user"><div class="bubble">${question}</div></div>`;

  // AI 回复气泡
  const aiId = 'ai-' + Date.now();
  messagesDiv.innerHTML += `<div class="msg ai" id="${aiId}"><div class="bubble" id="${aiId}-text">
    <div class="dots" style="justify-content:flex-start;margin:0"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div></div>`;
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  chatHistory.push({ role: 'user', content: question });

  try {
    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        stream: true,
        system: `你是一位专业但亲切的股票分析师助手。用户正在分析${marketLabel()}股票 ${currentTicker}，请基于之前的分析内容回答用户的追问。语言简洁通俗，不要给出明确的买卖建议。`,
        messages: chatHistory
      })
    });

    if (!response.ok) throw new Error('请求失败');

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let replyText = '';
    const bubble = document.getElementById(aiId + '-text');

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
      for (const line of lines) {
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.delta?.text || '';
          replyText += delta;
          bubble.innerHTML = renderMarkdown(replyText);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        } catch(e) {}
      }
    }

    chatHistory.push({ role: 'assistant', content: replyText });

  } catch(e) {
    document.getElementById(aiId + '-text').textContent = '回复失败，请重试';
  }

  sendBtn.disabled = false;
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}
